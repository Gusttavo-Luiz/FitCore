<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCore Pro — Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <a href="index.html" class="logo"><div class="logo-mark">F</div><span>FitCore <b>Pro</b></span></a>
            <nav id="side-nav"></nav>
            <div class="spacer"></div>
            <div class="user-chip">
                <div class="avatar" id="user-avatar"></div>
                <div style="min-width:0;flex:1">
                    <b id="user-name"></b>
                    <small id="user-role"></small>
                </div>
                <button class="btn btn-ghost btn-sm" id="logout" title="Sair">⎋</button>
            </div>
        </aside>

        <main class="main">
            <div class="topbar">
                <div style="display:flex;gap:12px;align-items:center">
                    <button class="btn btn-sm menu-toggle" id="menu-toggle">☰</button>
                    <div>
                        <h1 id="page-title"></h1>
                        <p id="page-sub"></p>
                    </div>
                </div>
                <div id="page-actions"></div>
            </div>
            <div id="view"></div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
